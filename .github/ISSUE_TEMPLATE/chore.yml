name: 🧹 Chore
description: Maintenance, dependencies, CI tooling, or routine housekeeping. Title it as a plain sentence — no "chore:" prefix.
labels: ['type: chore']
body:
  - type: textarea
    id: what
    attributes:
      label: What needs doing
      description: The housekeeping task and why it's worth doing.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Definition of done
      value: |
        - [ ]
    validations:
      required: false
