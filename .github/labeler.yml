# PR auto-labeler config (actions/labeler@v7). Maps changed paths to the area
# labels defined in .github/labels.yml.

'area: anatomy':
  - changed-files:
      - any-glob-to-any-file:
          - 'web/src/anatomy/**'
          - 'web/src/squat/**'
          - 'docs/squat/**'

'area: coherence':
  - changed-files:
      - any-glob-to-any-file:
          - 'web/src/views/**'
          - 'web/src/components/**'

'area: backend':
  - changed-files:
      - any-glob-to-any-file:
          - 'supabase/**'

'area: factory':
  - changed-files:
      - any-glob-to-any-file:
          - '.claude/**'
          - '.github/**'
          - 'CLAUDE.md'
          - 'WORKFLOW.md'
          - 'FACTORY.md'

'area: mobile':
  - changed-files:
      - any-glob-to-any-file:
          - 'web/android/**'
          - 'web/capacitor.config.json'

'area: design':
  - changed-files:
      - any-glob-to-any-file:
          - 'DESIGN.md'
          - 'web/.design-sync/**'
          - 'web/src/constants/theme.js'
          - 'web/src/constants/ui.js'
          - 'web/src/constants/tokens.js'
          - 'web/src/utils/themeCss.js'

'type: docs':
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.md'
