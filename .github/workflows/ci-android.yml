name: CI — Android

# Path filtering is at the JOB level, never workflow-level `on.paths`, for the
# reason ci-web.yml:3-7 gives: a workflow that never triggers reports NOTHING,
# so as a required check it strands the PR on "Expected — waiting for status",
# whereas a job skipped by an `if:` reports "skipped", which branch protection
# counts as passing. zone-bands.yml was converted for the same reason.
#
# `push` is scoped to main — the same as every other workflow here — because a
# push glob over the branch prefixes we actually work on (claude/**, feature/**,
# fix/**) collided with `pull_request` in the concurrency group below: on a PR
# from one of those branches `github.head_ref` and `github.ref_name` resolve to
# the SAME string, so the pull_request run cancelled the push run for the same
# commit. That left CANCELLED check-runs on the head SHA under `Build Debug APK`
# (required) and `Build Web Assets`, which `gh pr checks` renders as "fail" — a
# red PR with nothing failing (PR #329, runs 33142558605 / 33142584769, 31s apart
# on 41b3b62, 2026-08-28; #330). Pre-merge cover is unchanged: the pull_request
# event still builds every PR, and it was the surviving run all along. Do not
# re-add the prefix globs without also making the concurrency group event-aware.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-android-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

# Read-only floor; the android-latest publish job below is the one
# `contents: write` exception. pull-requests: read is for paths-filter.
permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect Android inputs
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            android:
              - 'web/android/**'
              - 'web/capacitor.config.json'
              - 'web/package.json'
              - 'web/src/**'
              - 'supabase/**'
              - '.github/workflows/ci-android.yml'

  build-web:
    name: Build Web Assets
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.android == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: web
      - name: Build web app
        run: npm run build
        working-directory: web
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # Same run number Gradle uses for versionCode / versionName, so the
          # splash and Settings About label match Obtainium (#773, #763).
          SPLITIQ_VERSION_CODE: ${{ github.run_number }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: web/dist/
          retention-days: 1

  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    needs: [changes, build-web]
    # A plain `if:` carries an implicit success(), so a failed build-web made
    # this required job SKIP, and a skipped check counts as passing (#326).
    # !cancelled() lets it start after a failed need and the first step turns
    # that into a red check. Not always(): a run superseded by cancel-in-progress
    # must stay cancelled. A non-Android PR still skips both jobs.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.android == 'true') }}
    outputs:
      testing-apk: ${{ steps.testing-apk.outcome == 'success' }}
      version-name: ${{ steps.version.outputs.name }}
    env:
      # versionCode must rise on every build for an update to install (#763).
      SPLITIQ_VERSION_CODE: ${{ github.run_number }}
      # Empty on fork and Dependabot PRs, and until Scott adds the secrets:
      # those builds keep the runner's throwaway debug key and publish nothing.
      HAS_TESTING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Require Detect Android inputs and Build Web Assets to have succeeded
        if: needs.changes.result != 'success' || needs.build-web.result != 'success'
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          WEB_RESULT: ${{ needs.build-web.result }}
        run: |
          echo "::error::Detect Android inputs: $CHANGES_RESULT; Build Web Assets: $WEB_RESULT. The APK needs both to succeed (#326)."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
      - name: Install web dependencies
        run: npm ci
        working-directory: web
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist/
      # The movement tools are web-only: the APK opens the dashboard and never
      # routes to /squat or /row. Their data (the squat's 2.2 MB, and every
      # other registered file) and their JS — the tool chunks, the decode
      # worker and the three.js scene (~140 KB gzip) — would ship as dead
      # weight. scripts/movementAssets.mjs registers every such file and
      # vite.config.js names the JS anatomy-*; check-bundle-size.mjs fails the
      # web build if that ever stops being true, so the registry's rule is the
      # whole strip. RouteRoot's lazy imports name the tool chunks but never
      # run natively, and the service worker does not precache any of them
      # (globIgnores), so nothing fetches them. The checkout, Node and npm ci
      # above are what the script needs.
      - name: Drop the web-only movement tools
        run: node scripts/strip-tool-assets.mjs dist/assets
        working-directory: web
      # The dashboard's Spanish catalogs are the opposite case: the APK ships
      # the dashboard, so it carries them and Spanish works offline. Both (the
      # boot catalog and, since i18n Phase 2a, the views catalog) are named
      # i18n-* (scripts/i18nChunks.mjs) and must survive the strip above, while
      # no movement-tool file may.
      - name: Assert the Spanish catalogs ship and no movement tool does
        run: |
          ls dist/assets/i18n-es-*.js
          count=$(ls dist/assets/i18n-es-*.js | wc -l)
          if [ "$count" -lt 2 ]; then
            echo "expected both Spanish dashboard catalogs, found $count" >&2
            exit 1
          fi
          node scripts/strip-tool-assets.mjs --check dist/assets
        working-directory: web
      - name: Sync Capacitor assets
        run: npx cap sync android
        working-directory: web
      - name: Version
        id: version
        run: echo "name=$(node -p "require('./package.json').version")+$SPLITIQ_VERSION_CODE" >> "$GITHUB_OUTPUT"
        working-directory: web
      - name: Decode the testing signing key
        if: env.HAS_TESTING_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/splitiq-testing.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/splitiq-testing.jks" >> "$GITHUB_ENV"
      - name: No testing key
        if: env.HAS_TESTING_KEY != 'true'
        run: echo "::notice::No testing key secrets, so this APK uses a throwaway debug key and nothing is published to android-latest."
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug
        working-directory: web/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: splitiq-debug
          path: web/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      # main only: the non-debuggable APK for the public android-latest link.
      # PR code never reaches that link.
      - name: Build testing APK
        id: testing-apk
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAS_TESTING_KEY == 'true'
        run: |
          ./gradlew :app:assemblePreview
          cp app/build/outputs/apk/preview/app-preview.apk "$RUNNER_TEMP/splitiq.apk"
          "$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner" verify --print-certs "$RUNNER_TEMP/splitiq.apk" | grep SHA-256
        working-directory: web/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - if: steps.testing-apk.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: splitiq-testing
          path: ${{ runner.temp }}/splitiq.apk
          retention-days: 1

  # One rolling prerelease, never "Latest": /releases/latest is the
  # squat-anatomy archive and must stay so. Fixed URL:
  # https://github.com/skizzy1986/SplitIQ/releases/download/android-latest/splitiq.apk
  publish-android-latest:
    name: Publish android-latest
    runs-on: ubuntu-latest
    needs: build-apk
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build-apk.result == 'success' && needs.build-apk.outputs.testing-apk == 'true'
    permissions:
      contents: write
    concurrency:
      group: android-latest-publish
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: splitiq-testing
      - name: Create or update the android-latest prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          VERSION_NAME: ${{ needs.build-apk.outputs.version-name }}
          VERSION_CODE: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="SplitIQ Android $VERSION_NAME"
          notes=$(printf 'Rolling testing build from `main`, replaced on every Android build. Public, signed with the testing key (not a Play Store build).\n\n- versionName: %s\n- versionCode: %s\n- Commit: %s\n- Run: %s\n\nSetup: docs/android-testing-install.md' "$VERSION_NAME" "$VERSION_CODE" "$SHA" "$RUN_URL")
          if gh release view android-latest -R "$REPO" > /dev/null 2>&1; then
            gh release upload android-latest splitiq.apk -R "$REPO" --clobber
            gh release edit android-latest -R "$REPO" --title "$title" --notes "$notes" --prerelease --latest=false
          else
            gh release create android-latest splitiq.apk -R "$REPO" --target "$SHA" --title "$title" --notes "$notes" --prerelease --latest=false
          fi
