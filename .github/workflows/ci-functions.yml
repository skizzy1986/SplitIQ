name: CI — Edge Functions

# Same job-level path-filtering pattern as ci-web.yml, and for the same reason:
# workflow-level `on.paths` makes a required check report nothing and leaves the
# PR stuck on "Expected — waiting for status", whereas an `if:`-skipped job
# reports "skipped", which branch protection counts as passing.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-functions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect edge function changes
    runs-on: ubuntu-latest
    outputs:
      functions: ${{ steps.filter.outputs.functions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            functions:
              - 'supabase/functions/**'
              - '.github/workflows/ci-functions.yml'

  test:
    name: Deno Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.functions == 'true'
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2 branch head, resolved 2026-11-06
        with:
          deno-version: v2.x
      # `deno run`, not `deno test`: these files are assertion scripts with
      # their own harness rather than Deno.test() cases, so `deno test` reports
      # a misleading "0 passed" while still honouring their Deno.exit(1).
      # Running them directly makes the pass/fail count the real output.
      #
      # These steps do NOT typecheck. `deno run` stopped type-checking by
      # default in Deno 1.23 (verified: a file assigning a string to a
      # `number` runs without complaint). Adding `--check` is not a free
      # win — the strava-import suite drives runImport with a structural
      # fake and carries deliberate casts at that boundary, and the
      # type-only jsr import that keeps jsr.io out of the test graph would
      # have to resolve. Anyone turning it on should expect to fix both.
      - name: vitals-import parser + cron guard
        run: deno run --allow-env vitals-import/test.ts
      - name: vitals-import-api client + mapper
        run: deno run --allow-env vitals-import-api/test.ts
      # Not auto-discovered: the steps in this job are hardcoded, so a new
      # function's tests run only once a step is added for them by hand.
      - name: strava-import mapper + state + tokens + cron guard + runImport
        run: deno run --allow-env strava-import/test.ts
      - name: strava-import deletion sync + revocation purge (#630)
        run: deno run --allow-env strava-import/deletion_test.ts
      - name: strava-connect disconnect preview + confirm + reconnect patch (#630)
        # --allow-read scoped to the one file CT-05 reads (the callback's source).
        run: deno run --allow-env --allow-read=strava-oauth-callback/index.ts strava-connect/test.ts
      - name: vitals-sync CORS + date window + specs + upsert args + activity mapper
        run: deno run vitals-sync/test.ts
      # Last, so a lint finding never hides a test result.
      # Lint, not format. `deno fmt --check` fails on most files here (they
      # were never formatted by it); turning it on means one reformat-only PR
      # first, not a step that is red from day one. `no-import-prefix` is
      # excluded because inline `jsr:`/`npm:` specifiers are the Supabase
      # convention: each function deploys with its own (empty) deno.json, so
      # there is no shared import map to move them into. setup-deno floats on
      # v2.x, so a new recommended rule in a Deno release can turn this red
      # on an unrelated PR — fix the finding, or exclude the rule here.
      - name: deno lint
        run: deno lint --rules-exclude=no-import-prefix
