name: PR labeler

# Applies area labels to PRs based on which files changed (see .github/labeler.yml),
# then sets exactly one `type:` label from the PR title's Conventional Commit
# type (WORKFLOW.md §1). The type mapping lives only in this file.
#
# The type step is kept out of the required title check (pr-title-lint.yml): a
# labels-API failure must never block a merge, and folding it into the
# required job would let it do so. It is advisory (continue-on-error): a
# thrown API error would render as a red check, and
# .claude/skills/steward/SKILL.md tells agents to treat a red check as blocking.
#
# Both run in one job, the type step after the labeler, serialised per PR.
# The labeler with `sync-labels: true` snapshots the PR's labels, refetches
# and PUTs the full set, so a `type:` label written concurrently by a separate
# workflow could be resurrected or dropped (#605). Sequential in one job, under
# one concurrency group, no other `type:` writer can land between the two.

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Label by changed paths and title type
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Serialise per PR: labeler's setLabels PUT must never overlap the type
    # step of another run (#605). A newer queued run replacing a pending one
    # loses nothing — every run recomputes from fresh API state.
    concurrency:
      group: pr-labels-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          sync-labels: true

      # No checkout: pull_request_target; the title is read from the payload
      # as data and is never interpolated into a shell or evaluated.
      #
      # The script is unit-tested as it stands in this file by
      # web/scripts/__tests__/title-lint.test.mjs — change the two together.
      #
      # !cancelled(): still runs when the labeler step failed, so a labeler
      # error never costs the PR its type label.
      - name: Set the type label from the title
        if: ${{ !cancelled() }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        continue-on-error: true
        with:
          script: |
            const TYPE_LABELS = {
              feat: 'type: feature',
              fix: 'type: bug',
              revert: 'type: bug',
              docs: 'type: docs',
              refactor: 'type: refactor',
              perf: 'type: refactor',
              test: 'type: chore',
              ci: 'type: chore',
              build: 'type: chore',
              chore: 'type: chore',
              style: 'type: chore',
              config: 'type: chore',
              housekeeping: 'type: chore',
            };
            const pr = context.payload.pull_request;
            const m = pr.title.match(/^([a-z]+)(?:\([^)]*\))?!?: /);
            // hasOwn, not `in`: a title typed `constructor: x` must not
            // resolve to an Object.prototype member.
            if (!m || !Object.hasOwn(TYPE_LABELS, m[1])) return;
            const want = TYPE_LABELS[m[1]];

            // Fresh read: the payload's labels can be stale by the time a
            // queued run starts.
            const { data: current } = await github.rest.issues.listLabelsOnIssue({
              ...context.repo,
              issue_number: pr.number,
              per_page: 100,
            });
            const names = current.map((label) => label.name);

            // Add before removing, so a failure part-way never leaves the PR
            // with no type label at all.
            if (!names.includes(want)) {
              await github.rest.issues.addLabels({
                ...context.repo,
                issue_number: pr.number,
                labels: [want],
              });
            }
            for (const name of names) {
              if (!name.startsWith('type: ') || name === want) continue;
              try {
                await github.rest.issues.removeLabel({
                  ...context.repo,
                  issue_number: pr.number,
                  name,
                });
              } catch (error) {
                // 404: already gone (a concurrent edit removed it first),
                // which is the state this step wants anyway.
                if (error.status !== 404) throw error;
              }
            }

  # .claude/skills/steward/SKILL.md states CI facts as citations into the
  # workflows and check scripts. Those files move; the skill does not notice.
  # A comment on the PR that breaks a fact reaches the one person who can fix
  # it at the one moment re-verifying is cheap — a check would become a chore,
  # and would go green on any edit to the skill, including one that left it
  # wrong. Deliberately not a gate.
  #
  # No checkout: this workflow is pull_request_target, so it runs with write
  # permissions against the base repo. Reading the changed-file list through
  # the API means no PR-authored code is ever executed here.
  steward-staleness:
    name: Flag steward skill staleness
    runs-on: ubuntu-latest
    # Unchanged behaviour: this job never ran on `edited` before #605.
    if: github.event.action != 'edited'
    # Serialise per PR. Two rapid synchronize events (a push, then a
    # force-push) would otherwise both read "no marker comment yet" and both
    # create one. Not cancel-in-progress: the later run must still reconcile.
    concurrency:
      group: steward-staleness-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      # Advisory, so it must not be able to fail the PR: a thrown API error
      # would render as a red check, and the skill it guards tells agents to
      # treat a red check as blocking.
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        continue-on-error: true
        with:
          script: |
            const SKILL = '.claude/skills/steward/SKILL.md';
            const files = await github.paginate(
              github.rest.pulls.listFiles,
              { ...context.repo, pull_number: context.issue.number, per_page: 100 }
            );
            const names = files.map((f) => f.filename);
            // A PR already editing the skill is re-verifying by definition.
            if (names.includes(SKILL)) return;
            const cited = names.filter(
              (n) =>
                n.startsWith('.github/workflows/') ||
                /^web\/scripts\/check-.*\.mjs$/.test(n) ||
                ['web/vite.config.js', 'CLAUDE.md', 'WORKFLOW.md', 'DESIGN.md'].includes(n)
            );
            if (cited.length === 0) return;
            // Filenames are PR-author controlled and backticks are legal in a
            // git path, so an unescaped name breaks out of the code span and
            // injects markdown into a comment agents here read as input.
            // Whitelist the path charset rather than escaping: it also covers
            // newlines and raw HTML, and these paths only ever display.
            const safe = (n) => n.replace(/[^A-Za-z0-9._/-]/g, '?');
            const marker = '<!-- steward-staleness -->';
            const body = [
              marker,
              `This PR touches ${cited.length} file(s) that \`${SKILL}\` cites:`,
              '',
              ...cited.map((n) => `- \`${safe(n)}\``),
              '',
              'If a change here contradicts a line in that skill, update the line and the',
              '`Verified against` block. If nothing it cites changed in substance, ignore this.',
            ].join('\n');
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { ...context.repo, issue_number: context.issue.number, per_page: 100 }
            );
            const existing = comments.find((c) => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body,
              });
            }
