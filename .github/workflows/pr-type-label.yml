name: PR type label

# Sets exactly one `type:` label on a pull request from its title's
# Conventional Commit type (WORKFLOW.md §1). The mapping lives only here.
#
# A separate workflow from the required title check (pr-title-lint.yml): a
# labels-API failure must never block a merge, and folding this into the
# required job would let it do so.
#
# Advisory (continue-on-error): a thrown API error would render as a red
# check, and .claude/skills/steward/SKILL.md tells agents to treat a red
# check as blocking.
#
# Path labels come from labeler.yml with `sync-labels: true`, which never
# carries a `type:` key, so the two workflows do not fight over a label.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  label:
    name: Label by title type
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    # Serialise per PR so two rapid events cannot interleave add and remove.
    # Not cancel-in-progress: the later run must still reconcile.
    concurrency:
      group: pr-type-label-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      # No checkout: pull_request_target; the title is read from the payload
      # as data and is never interpolated into a shell or evaluated.
      #
      # The script is unit-tested as it stands in this file by
      # web/scripts/__tests__/title-lint.test.mjs — change the two together.
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        continue-on-error: true
        with:
          script: |
            const TYPE_LABELS = {
              feat: 'type: feature',
              fix: 'type: bug',
              revert: 'type: bug',
              docs: 'type: docs',
              refactor: 'type: refactor',
              perf: 'type: refactor',
              test: 'type: chore',
              ci: 'type: chore',
              build: 'type: chore',
              chore: 'type: chore',
              style: 'type: chore',
              config: 'type: chore',
              housekeeping: 'type: chore',
            };
            const pr = context.payload.pull_request;
            const m = pr.title.match(/^([a-z]+)(?:\([^)]*\))?!?: /);
            // hasOwn, not `in`: a title typed `constructor: x` must not
            // resolve to an Object.prototype member.
            if (!m || !Object.hasOwn(TYPE_LABELS, m[1])) return;
            const want = TYPE_LABELS[m[1]];

            // Fresh read: the payload's labels can be stale by the time a
            // queued run starts.
            const { data: current } = await github.rest.issues.listLabelsOnIssue({
              ...context.repo,
              issue_number: pr.number,
              per_page: 100,
            });
            const names = current.map((label) => label.name);

            // Add before removing, so a failure part-way never leaves the PR
            // with no type label at all.
            if (!names.includes(want)) {
              await github.rest.issues.addLabels({
                ...context.repo,
                issue_number: pr.number,
                labels: [want],
              });
            }
            for (const name of names) {
              if (!name.startsWith('type: ') || name === want) continue;
              try {
                await github.rest.issues.removeLabel({
                  ...context.repo,
                  issue_number: pr.number,
                  name,
                });
              } catch (error) {
                // 404: already gone (a concurrent edit removed it first),
                // which is the state this step wants anyway.
                if (error.status !== 404) throw error;
              }
            }
