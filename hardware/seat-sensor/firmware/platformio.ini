; SplitIQ seat-position sensor firmware.
; Arduino-ESP32 3.x comes from the pioarduino platform: PlatformIO's own
; espressif32 platform stops at Arduino-ESP32 2.0.x (ESP-IDF 4.4), which lacks the
; IDF 5 PCNT driver's accum_count (software extension past the 16-bit counter).
[env:seat-sensor]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
; N16R8 module: 16 MB quad flash. PSRAM is unused, so the default qio_qspi memory
; type is fine; the octal-PSRAM pins (GPIO 35-37) are still avoided in config.h.
board_upload.flash_size = 16MB
monitor_speed = 115200
; Serial is UART0 through the board's "UART" USB port (CDC on boot stays off).
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=2
lib_deps =
    https://github.com/h2zero/NimBLE-Arduino.git#2.3.9
